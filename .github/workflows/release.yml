name: Release

# Se dispara al subir un tag como v0.1.0.
#  - Publica binarios del CLI en la página de Releases.
#  - Publica `gprotab` y `gprotab-cli` en crates.io si existe el secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "" }
          - { os: macos-13,       target: x86_64-apple-darwin,       ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gprotab-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="gprotab-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/gprotab${{ matrix.ext }}" README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  crates-io:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (solo si hay token)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish -p gprotab
          # el índice de crates.io tarda unos segundos en reflejar la versión nueva
          sleep 30
          cargo publish -p gprotab-cli
      - name: Sin token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN no configurado; se omite crates.io"
