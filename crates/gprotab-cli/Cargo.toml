[package]
name = "gprotab-cli"
description = "CLI to search and download Guitar Pro tabs from gprotab.net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gprotab"
path = "src/main.rs"

[dependencies]
gprotab = { version = "0.1.0", path = "../gprotab", features = ["plugin"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
